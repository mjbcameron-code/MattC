# ---------------------------------------------------------------------------
# Staking, selection thresholds and model tuning.
# Everything here is read at runtime — change a number, re-run `vb tips`.
# ---------------------------------------------------------------------------

bankroll:
  # 1 pt = 1 unit. Bet sizes are always quoted in points, never in money.
  starting_points: 100.0
  kelly_fraction: 0.25      # quarter-Kelly: the standard defensive setting
  max_stake_pts: 3.0
  min_stake_pts: 0.25
  stake_step: 0.25          # stakes are rounded to this

selection:
  min_edge: 0.04            # 4% expected value before a bet is even considered
  # And an upper bound. An edge above this on a market a dozen books price is
  # not value, it is a bug — a mis-read line, a one-sided market, a stale
  # price. Better to miss it than to stake three points on it.
  max_edge: 0.25
  # Expected value is a share of the stake, which is not a fixed amount of
  # evidence: 4% at 1.50 means beating the price by 2.7 points of probability,
  # but 4% at 23.0 means beating it by 0.17 of a point — less than the model's
  # own calibration error. Without this the card fills with longshots, because
  # they are the cheapest place to manufacture an edge. So a bet must also beat
  # the price by this much in probability, whatever the price.
  min_prob_edge: 0.02
  min_odds: 1.40            # nothing shorter — the downside isn't worth it
  # Where the ordinary card stops. This follows from the two numbers above
  # rather than being a taste: at 12.5 the 2-point probability edge already
  # implies a 25% expected value, which is the point where max_edge calls it a
  # data fault. Past there the two rules contradict each other.
  max_odds: 12.0
  # So a longer price is judged by its own set of rules rather than by a
  # loosened version of the ordinary ones. The bargain: a much fatter edge, a
  # smaller but still real probability edge, more corroborating signals than a
  # normal bet needs, and stakes capped low whatever Kelly says.
  #
  # Be clear-eyed about it. Two seasons of backtesting say this is the least
  # reliable part of the model — a fraction of a point of probability error
  # moves the edge enormously at 20.0 — and the first version of this engine
  # filled its card with 23.00 shots for exactly that reason. These numbers are
  # set to admit the occasional well-supported outsider, not to reopen that.
  longshots:
    enabled: true
    max_odds: 34.0          # 33/1. Beyond this it is a raffle ticket.
    min_edge: 0.10          # against 4% for an ordinary single
    min_prob_edge: 0.005    # half a point of probability, against two
    min_signals: 3          # against two: the "good reason" has to exist
    max_stake_pts: 0.5      # small, always, whatever the arithmetic says
  min_model_prob: 0.05      # ignore lottery tickets the model barely rates
  max_tips_per_week: 12
  max_tips_per_league: 3
  # A bet needs this many "supporting signals" (form, xG trend, team news,
  # rest advantage, market drift) before it can be tipped, on top of the edge.
  min_signals: 2

accumulator:
  enabled: true
  min_legs: 2
  max_legs: 4
  min_leg_prob: 0.45        # only fold reasonably likely legs together
  min_combined_edge: 0.10   # accas need a bigger edge to justify the variance
  max_stake_pts: 1.0
  # Each leg's probability is shaded by this before folding. Model error
  # compounds across legs exactly as the odds do, so an unshaded four-fold
  # flatters itself badly.
  leg_haircut: 0.04

bet_builder:
  enabled: true
  min_legs: 2
  max_legs: 4
  # Same-game legs are correlated, so bet builder prices are computed by
  # Monte Carlo simulation rather than by multiplying leg probabilities.
  simulations: 40000
  # Bookmakers price builders with a heavier margin; demand more edge.
  min_combined_edge: 0.12
  # Shade every leg by this before combining, the same as an accumulator does.
  # Measured over two seasons the model over-predicts in every probability
  # band, and that error compounds once per leg. Builders had no haircut and
  # lost 25% of everything staked on them — 87% of the total loss from 26% of
  # the money — while accumulators, which do shade, finished ahead.
  leg_haircut: 0.04
  max_stake_pts: 1.0

long_term:
  enabled: true
  # Outright / season-long markets: title, relegation, promotion, top scorer.
  min_edge: 0.10            # tied-up money needs a fatter edge
  # The same longshot trap as above, and worse here: an outright price is not
  # blended against a market, it is the season simulation on its own. At 100/1
  # a 10% edge needs the simulation to rate a side 1.1% rather than 1.0%.
  min_prob_edge: 0.03
  max_stake_pts: 2.0

model:
  # Dixon-Coles time decay. Half-life in days for match weighting.
  half_life_days: 180
  # Seasons of history to fit on.
  history_seasons: 3
  min_matches_per_team: 6
  # Weight given to real/proxy xG versus actual goals when fitting attack and
  # defence strength. xG is the better predictor; goals still carry finishing.
  xg_weight: 0.65
  # How much the model opinion counts against the (devigged) market price.
  # Sharper markets get a lower weight. Keyed by league tier.
  # These are a starting point, not gospel. Run `vb backtest` on real data and
  # check the calibration table: if the model keeps predicting 65% and getting
  # 55%, these numbers are too high.
  market_blend:
    "0": 0.22               # UCL / UEL — very sharp, and few games to fit on
    "1": 0.26               # top divisions
    "2": 0.30
    "3": 0.34
    "4": 0.36
    "5": 0.38               # National League — softest prices, but the weakest
                            # data too, which is why this is not 0.6
  # Half-weight is reached at this many matches per club. A promoted side eight
  # games into a season gets half the say of one thirty games in.
  confidence_k: 8.0
  # Matches in a new division before a promoted club is judged on that record
  # alone rather than on what it did in the division below.
  promoted_blend_matches: 10
  # Correcting the model against its own record. Every probability it produces
  # is mapped through a straight line in log-odds before an edge is taken from
  # it: corrected_logit = slope x logit(p) + intercept.
  #
  # Defaults are the identity — no correction — because a wrong one is worse
  # than none. Fit your own with `vb calibrate`, which splits the record in
  # half and reports the half it did not learn from.
  #
  # A slope near 1 with a negative intercept means the model is not mis-shaped,
  # only uniformly over-confident. That is what two seasons of this one showed.
  calibration:
    slope: 1.0
    intercept: 0.0
  # Shrinkage of a team's rating toward the league mean when it has few games.
  shrinkage_matches: 10
  # How much a team's strength is moved by missing players. A squad reported as
  # 0.20 "missing" loses 0.20 x attack_factor of its attacking output.
  news_attack_factor: 0.55
  news_defence_factor: 0.40

# ---------------------------------------------------------------------------
# Cross-league strength, for Champions League and Europa League ties.
#
# There are no results between a Bundesliga club and a Premier League club to
# fit on, so the gap between divisions is a *prior*, expressed on the same log
# scale as the attack/defence ratings (0.30 is roughly a one-division gap).
# Nudge these if European results keep landing on one side of your model.
# ---------------------------------------------------------------------------
league_strength:
  E0: 0.00        # reference
  SP1: -0.01
  D1: -0.03
  I1: -0.03
  E1: -0.32
  E2: -0.52
  E3: -0.64
  EC: -0.78
  SC0: -0.34
  SC1: -0.62
  SC2: -0.74
  SC3: -0.84
  D2: -0.34
  I2: -0.36
  SP2: -0.34

markets:
  goal_lines: [0.5, 1.5, 2.5, 3.5, 4.5]
  team_goal_lines: [0.5, 1.5, 2.5]
  corner_lines: [7.5, 8.5, 9.5, 10.5, 11.5, 12.5, 13.5]
  card_lines: [2.5, 3.5, 4.5, 5.5]
  booking_points_lines: [25.5, 35.5, 45.5, 55.5]   # 10 per yellow, 25 per red
  player_sot_lines: [0.5, 1.5, 2.5]
  asian_handicaps: [-2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0]

bookmakers:
  # Books we shop for a price, in rough order of preference for the write-up.
  preferred:
    - skybet
    - bet365
    - paddypower
    - williamhill
    - ladbrokes_uk
    - coral
    - betfred
    - betvictor
    - boylesports
    - unibet_uk
    - 888sport
    - betway
  # Exchange prices are near-fair (low margin) so they are used as the
  # benchmark for what a price *should* be, not as a bet to place.
  exchanges:
    - betfair_ex_uk
    - betfair_ex           # how football-data.co.uk's Betfair columns are stored
    - betfair
    - smarkets
    - matchbook
  # Not bookmakers at all: football-data publishes the best and the average
  # price across its panel. Useful for working out what a fair price is, and
  # impossible to bet with.
  aggregates:
    - market_max
    - market_avg
  region: uk

devig:
  # How to strip the bookmaker's overround: shin | odds_ratio | proportional
  method: shin

report:
  season: "2026/27"
  title: "The Value Ledger"
  tipster_name: "The Ledger"
