# Club-name spellings -> canonical name.
#
# football-data.co.uk uses terse forms ("Nott'm Forest", "M'gladbach",
# "Ath Madrid"); the-odds-api uses long ones ("Nottingham Forest",
# "Borussia Monchengladbach", "Atletico Madrid"). Both are listed here so the
# two feeds join onto one club row. Anything not listed falls through to the
# fuzzy matcher in vb/repo.py.
#
# Add a line whenever `vb doctor` reports an unmatched club.

