{% extends "base.html" %}
{% block title %}News{% endblock %}
{% block nav_news %}active{% endblock %}
{% block content %}
<div class="panel">
    <div class="panel-header">Inbox</div>
    <div class="panel-body" style="padding:0;">
        {% for item in items %}
        <div style="padding:12px 16px;border-bottom:1px solid var(--cm-border);">
            <div class="flex-between">
                <div style="font-weight:bold;font-size:14px;">{{ item.headline }}</div>
                <span class="tag">{{ item.category }}</span>
            </div>
            <div class="small muted mb">{{ item.date }}</div>
            <div>{{ item.body }}</div>
        </div>
        {% else %}
        <div class="panel-body muted">No news yet.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
