{% extends "base.html" %}
{% block title %}Live — {{ match.home_club.short_name }} v {{ match.away_club.short_name }}{% endblock %}
{% block content %}
<div class="scoreboard">
    <div class="team"><div class="tn">{{ match.home_club.name }}</div></div>
    <div class="score"><span id="hscore">0</span> - <span id="ascore">0</span>
        <div class="vs-min"><span id="clock">0</span>'</div></div>
    <div class="team"><div class="tn">{{ match.away_club.name }}</div></div>
</div>

<div class="panel">
    <div class="panel-header">Live Commentary</div>
    <div class="panel-body">
        <div class="commentary" id="commentary"></div>
        <div class="center mt" id="postmatch" style="display:none;">
            <a href="{{ url_for('match_result', match_id=match.id) }}" class="btn btn-accent"
               style="font-size:16px;padding:12px 40px;">Full Time — View Result ▶</a>
        </div>
        <div class="center mt" id="skipwrap">
            <button class="btn" onclick="skipToEnd()">Skip to Result</button>
        </div>
    </div>
</div>

<script>
const events = [
{% for e in events %}
    {minute: {{ e.minute }}, type: "{{ e.event_type }}",
     desc: {{ e.description | tojson }}, clubId: {{ e.club_id or 'null' }}},
{% endfor %}
];
const homeClubId = {{ match.home_club_id }};
const awayClubId = {{ match.away_club_id }};
const finalHome = {{ match.home_score }};
const finalAway = {{ match.away_score }};

let idx = 0, minute = 0, hScore = 0, aScore = 0;
const commDiv = document.getElementById('commentary');
const clockEl = document.getElementById('clock');
let timer;

function addLine(min, text, type) {
    const div = document.createElement('div');
    div.className = 'comm-line comm-' + type;
    div.innerHTML = '<span class="comm-min">' + min + "'</span><span class=\"comm-text\">" +
                    text + '</span>';
    commDiv.appendChild(div);
    commDiv.scrollTop = commDiv.scrollHeight;
}

function tick() {
    minute++;
    if (minute > 90) { finish(); return; }
    clockEl.textContent = minute;
    while (idx < events.length && events[idx].minute <= minute) {
        const ev = events[idx];
        if (ev.type === 'goal') {
            if (ev.clubId === homeClubId) hScore++; else aScore++;
            document.getElementById('hscore').textContent = hScore;
            document.getElementById('ascore').textContent = aScore;
        }
        addLine(ev.minute, ev.desc, ev.type);
        idx++;
    }
    if (minute === 45) addLine(45, 'Half Time', 'half_time');
}

function finish() {
    clearInterval(timer);
    document.getElementById('hscore').textContent = finalHome;
    document.getElementById('ascore').textContent = finalAway;
    clockEl.textContent = 90;
    addLine(90, 'Full Time! Final score ' + finalHome + ' - ' + finalAway, 'full_time');
    document.getElementById('postmatch').style.display = 'block';
    document.getElementById('skipwrap').style.display = 'none';
}

function skipToEnd() {
    clearInterval(timer);
    while (idx < events.length) {
        const ev = events[idx];
        if (ev.type === 'goal') { if (ev.clubId === homeClubId) hScore++; else aScore++; }
        addLine(ev.minute, ev.desc, ev.type);
        idx++;
    }
    finish();
}

addLine(1, 'Kick off! The match is underway.', 'event');
timer = setInterval(tick, 280);
</script>
{% endblock %}
